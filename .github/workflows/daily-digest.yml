name: Täglicher Finanz-Digest

on:
  schedule:
    # 05:30 UTC ≈ 07:30 MEZ / 07:30 MESZ. GitHub-Cron kann sich um einige
    # Minuten verzögern – das ist normal.
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Auslösen per Knopfdruck

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Digest erzeugen (ohne KI – Standard)
        run: python scripts/build_digest.py
        # Für KI-Zusammenfassung stattdessen folgende Zeilen nutzen und ein
        # Secret ANTHROPIC_API_KEY hinterlegen:
        #   env:
        #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        #   run: python scripts/build_digest.py --ai

      - name: Ergebnis committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --quiet --cached; then
            echo "Keine Änderungen."
          else
            git commit -m "Digest: $(date -u +%Y-%m-%d)"
            git push
          fi
