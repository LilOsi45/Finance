name: Täglicher Finanz-Digest

on:
  schedule:
    # Stündlich von 04:00 bis 21:00 UTC = ca. 06:00–23:00 deutscher Zeit.
    # So ist der Digest egal ob du um 6:00 oder 13:00 draufschaust frisch.
    # GitHub-Cron kann sich um einige Minuten verzögern – das ist normal.
    - cron: "0 4-21 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Auslösen per Knopfdruck

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Digest erzeugen (mit KI-Experten-Kommentar)
        env:
          # Wird sicher aus den GitHub-Secrets injiziert und in Logs maskiert.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_digest.py --ai

      - name: Ergebnis committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --quiet --cached; then
            echo "Keine Änderungen."
          else
            git commit -m "Digest: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
